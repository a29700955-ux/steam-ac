<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عبدالله ويقين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff3f5;--bg2:#ffd3de;--ink:#5c0f2a;--soft:#8b3552;
  --rose:#d6264f;--gold:#b9801f;
  --p1:#e0345c;--p2:#c21f4a;--p3:#9c1238;--edge:#7a0d2c;--leaf:#2f7a4f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#2b0716;--bg2:#4e0f29;--ink:#ffe6ec;--soft:#f3b7c6;
    --rose:#ff5d82;--gold:#f3cb8d;
    --p1:#ff5d82;--p2:#e63a65;--p3:#b8204a;--edge:#6f0c2b;--leaf:#4fae7b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#2b0716;--bg2:#4e0f29;--ink:#ffe6ec;--soft:#f3b7c6;
  --rose:#ff5d82;--gold:#f3cb8d;
  --p1:#ff5d82;--p2:#e63a65;--p3:#b8204a;--edge:#6f0c2b;--leaf:#4fae7b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  font-family:"Tajawal",system-ui,sans-serif;
  color:var(--ink);
  background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg1) 70%) var(--bg1);
  background-attachment:fixed;
  overflow-x:hidden;
}
main{max-width:640px;margin:0 auto;padding:28px 22px 56px;text-align:center;position:relative;z-index:2}
.bloom{width:min(46vw,190px);margin:8px auto 0;display:block;filter:drop-shadow(0 10px 18px rgba(120,10,40,.3))}
.names{
  display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,20px);
  font-family:"Aref Ruqaa",serif;font-weight:700;
  font-size:clamp(40px,12vw,76px);line-height:1.25;margin:6px 0 4px;
}
.names .heart{width:.7em;height:.7em;flex:none;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.sub{font-family:"Aref Ruqaa",serif;font-size:clamp(18px,5vw,24px);color:var(--gold);margin:0 0 30px}
.lines{margin:0 auto 34px;max-width:30em}
.lines p{margin:0 0 14px;font-size:clamp(17px,4.6vw,20px);line-height:2;color:var(--soft)}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 30px;color:var(--rose)}
.divider::before,.divider::after{content:"";height:1px;width:22%;background:currentColor;opacity:.5}
.since{margin:0 auto 34px;padding:20px 16px;border:1.5px solid color-mix(in srgb,var(--rose) 45%,transparent);border-radius:26px 8px 26px 8px;max-width:420px}
.since label{display:block;font-size:16px;color:var(--soft);margin-bottom:10px}
.since input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--soft);border-radius:10px;padding:8px 12px;text-align:center}
.since input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#days{font-family:"Aref Ruqaa",serif;font-size:clamp(22px,6vw,30px);margin:14px 0 0;min-height:1.6em;color:var(--rose)}
button{
  font:inherit;font-weight:500;font-size:18px;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,var(--p1),var(--p3));
  border:0;border-radius:999px;padding:13px 32px;
  box-shadow:0 8px 20px rgba(160,20,60,.35);
}
button:active{transform:scale(.97)}
#letter{
  margin:26px auto 0;max-width:30em;font-family:"Aref Ruqaa",serif;
  font-size:clamp(20px,5.4vw,26px);line-height:2.1;
  opacity:0;max-height:0;overflow:hidden;transition:opacity .9s,max-height 1s;
}
#letter.open{opacity:1;max-height:600px}
#letter b{display:block;margin-top:10px;color:var(--gold);font-weight:400}
.flank{display:flex;justify-content:center;gap:26px;margin-top:34px}
.flank svg{width:54px;opacity:.9}
.flank svg:nth-child(2){width:70px}
footer{font-size:14px;color:var(--soft);margin-top:18px;opacity:.8}
#petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.petal{position:absolute;top:-30px;border-radius:80% 0 80% 0;background:var(--rose);opacity:.65;animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),112vh) rotate(540deg)}}
.pop{position:fixed;z-index:5;pointer-events:none;font-size:22px;animation:up 1.5s ease-out forwards}
@keyframes up{to{transform:translate(var(--dx),-150px) scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .names .heart{animation:none}.pop{animation-duration:.01s}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="rose" viewBox="0 0 100 140">
      <path d="M50 72 C47 96 53 116 50 140" stroke="var(--leaf)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M50 108 C31 104 21 92 19 82 C38 84 48 94 50 108Z" fill="var(--leaf)"/>
      <path d="M50 120 C68 116 78 105 80 96 C62 98 52 107 50 120Z" fill="var(--leaf)"/>
      <g transform="translate(50 50)" stroke="var(--edge)" stroke-width=".8">
        <ellipse rx="21" ry="27" cy="-12" fill="var(--p1)"/>
        <ellipse rx="21" ry="27" cy="-12" fill="var(--p1)" transform="rotate(72)"/>
        <ellipse rx="21" ry="27" cy="-12" fill="var(--p1)" transform="rotate(144)"/>
        <ellipse rx="21" ry="27" cy="-12" fill="var(--p1)" transform="rotate(216)"/>
        <ellipse rx="21" ry="27" cy="-12" fill="var(--p1)" transform="rotate(288)"/>
        <ellipse rx="15" ry="19" cy="-8" fill="var(--p2)" transform="rotate(36)"/>
        <ellipse rx="15" ry="19" cy="-8" fill="var(--p2)" transform="rotate(108)"/>
        <ellipse rx="15" ry="19" cy="-8" fill="var(--p2)" transform="rotate(180)"/>
        <ellipse rx="15" ry="19" cy="-8" fill="var(--p2)" transform="rotate(252)"/>
        <ellipse rx="15" ry="19" cy="-8" fill="var(--p2)" transform="rotate(324)"/>
        <ellipse rx="9" ry="12" cy="-5" fill="var(--p3)"/>
        <ellipse rx="9" ry="12" cy="-5" fill="var(--p3)" transform="rotate(90)"/>
        <ellipse rx="9" ry="12" cy="-5" fill="var(--p3)" transform="rotate(180)"/>
        <ellipse rx="9" ry="12" cy="-5" fill="var(--p3)" transform="rotate(270)"/>
        <path d="M-4 0 a4 4 0 1 1 4 4 a7 7 0 0 1 -7 -7" fill="none" stroke="var(--edge)" stroke-width="1.4"/>
      </g>
    </symbol>
    <symbol id="heart" viewBox="0 0 24 22">
      <path d="M12 21 C-6 9 3 -3 12 5 C21 -3 30 9 12 21Z" fill="var(--rose)"/>
    </symbol>
  </defs>
</svg>

<div id="petals" aria-hidden="true"></div>

<main>
  <svg class="bloom" viewBox="0 0 100 140" role="img" aria-label="وردة"><use href="#rose"/></svg>

  <h1 class="names">
    <span>عبدالله</span>
    <svg class="heart" viewBox="0 0 24 22" aria-hidden="true"><use href="#heart"/></svg>
    <span>يقين</span>
  </h1>
  <p class="sub">حكايتنا أجمل من الورد</p>

  <div class="lines">
    <p>في كل مكان أروح له، قلبي يدوّر عليك.</p>
    <p>أنتِ البيت اللي أرجع له مهما تعبت.</p>
    <p>يا يقين، اسمك بس يكفي يطمّني.</p>
  </div>

  <div class="divider" aria-hidden="true">🌹</div>

  <section class="since">
    <label for="date">متى بدأت حكايتنا؟</label>
    <input id="date" type="date">
    <p id="days" aria-live="polite"></p>
  </section>

  <button id="open" type="button">افتحي رسالتي</button>
  <div id="letter">
    يقين، وجودك في حياتي أجمل شيء صار لي.<br>
    معك صار كل يوم عادي يوم مميز،<br>
    وكل ورد الدنيا ما يسوى ابتسامتك.<br>
    <b>— عبدالله</b>
  </div>

  <div class="flank" aria-hidden="true">
    <svg viewBox="0 0 100 140"><use href="#rose"/></svg>
    <svg viewBox="0 0 100 140"><use href="#rose"/></svg>
    <svg viewBox="0 0 100 140"><use href="#rose"/></svg>
  </div>
  <footer>اضغطي في أي مكان على الشاشة 💗</footer>
</main>

<script>
(function(){
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var layer = document.getElementById("petals");
  if(!still){
    for(var i=0;i<28;i++){
      var p=document.createElement("i");
      var s=10+Math.random()*14;
      p.className="petal";
      p.style.left=Math.random()*100+"vw";
      p.style.width=s+"px";
      p.style.height=(s*1.3)+"px";
      p.style.animationDuration=(8+Math.random()*8)+"s";
      p.style.animationDelay=(-Math.random()*12)+"s";
      p.style.setProperty("--dx",(Math.random()*180-90)+"px");
      layer.appendChild(p);
    }
  }
  var icons=["❤️","💗","🌹","💖","💕"];
  function burst(x,y,n){
    for(var i=0;i<n;i++){
      var h=document.createElement("span");
      h.className="pop";
      h.textContent=icons[Math.floor(Math.random()*icons.length)];
      h.style.left=x+"px";h.style.top=y+"px";
      h.style.setProperty("--dx",(Math.random()*120-60)+"px");
      document.body.appendChild(h);
      setTimeout(function(el){el.remove()},1600,h);
    }
  }
  document.addEventListener("pointerdown",function(e){
    if(e.target.closest("input,button")) return;
    burst(e.clientX,e.clientY,5);
  });
  document.getElementById("open").addEventListener("click",function(e){
    document.getElementById("letter").classList.add("open");
    var r=e.target.getBoundingClientRect();
    burst(r.left+r.width/2,r.top,18);
  });
  var input=document.getElementById("date"), out=document.getElementById("days");
  function show(){
    if(!input.value){out.textContent="";return;}
    var d=Math.floor((Date.now()-new Date(input.value).getTime())/86400000);
    out.textContent = d>=0 ? "صار لنا "+d.toLocaleString("ar-SA")+" يوم مع بعض 💞" : "";
  }
  try{var saved=localStorage.getItem("loveDate"); if(saved){input.value=saved;}}catch(err){}
  input.addEventListener("change",function(){
    try{localStorage.setItem("loveDate",input.value);}catch(err){}
    show();
  });
  show();
})();
</script>
</body>
</html>
