<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Games</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://wallpaperaccess.com/full/1110777.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .logo { font-size: 20px; font-weight: bold; color: #00ffff; text-shadow: 0 0 15px #00ffff; }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .menu-btn { font-size: 22px; cursor: pointer; color: white; }
        .container { padding: 15px; max-width: 1200px; margin: auto; }
        .search-bar { width: 100%; padding: 12px; border-radius: 25px; border: 1px solid #3a3a3a; background: rgba(0,0,0,0.5); color: white; margin-bottom: 15px; box-sizing: border-box; text-align: right; }
        .vip-btn { display: block; width: 100%; padding: 12px; background: linear-gradient(90deg, #ff007f, #7928ca); border: none; border-radius: 10px; font-weight: bold; font-size: 16px; margin-bottom: 15px; cursor: pointer; color: white; text-align: center; text-decoration: none; text-shadow: 0 0 5px white; }
        .add-btn { display: none; padding: 8px 15px; background: #00ff80; border: none; border-radius: 10px; font-weight: bold; color: black; cursor: pointer; font-size: 14px; }
        .filters { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        .filter-btn { padding: 8px 15px; border-radius: 20px; border: 1px solid #7928ca; background: rgba(0,0,0,0.6); color: white; cursor: pointer; white-space: nowrap; font-size: 14px; }
        .filter-btn.active { background: #00ffff; color: black; font-weight: bold; border-color: #00ffff; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 15px; } }
        .card { background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; position: relative; }
        .card:hover { transform: scale(1.02); }
        .card img { width: 100%; height: 110px; object-fit: cover; }
        .card h3 { margin: 8px; font-size: 13px; text-align: center; word-break: break-word; }
        .delete-btn { display: none; position: absolute; top: 10px; left: 10px; background: rgba(255, 0, 0, 0.8); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; align-items: center; justify-content: center; z-index: 10; padding: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        /* Reviews Section - Split Layout */
        .reviews-section { margin-top: 50px; padding: 25px; background: rgba(0,0,0,0.5); border-radius: 15px; border: 1px solid #3a3a3a; }
        .reviews-title { text-align: center; color: #00ffff; margin-bottom: 30px; }
        .reviews-content { display: flex; flex-direction: column-reverse; gap: 30px; }
        @media (min-width: 768px) {
            .reviews-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; flex-direction: row; }
        }
        .review-form-container { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .review-form { display: flex; flex-direction: column; gap: 15px; }
        .review-form input, .review-form select, .review-form textarea { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; text-align: right; }
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 5px; font-size: 28px; cursor: pointer; margin: 10px 0; }
        .star-rating input { display: none; }
        .star-rating label { color: #555; transition: color 0.2s; }
        .star-rating input:checked ~ label, .star-rating label:hover, .star-rating label:hover ~ label { color: #ffcc00; }
        
        .reviews-display-container { display: flex; flex-direction: column; gap: 15px; max-height: 600px; overflow-y: auto; padding: 5px; }
        .review-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: right; }
        .review-card h4 { margin: 0 0 5px 0; color: #00ffff; font-size: 16px; }
        .review-card .platform { display: inline-block; padding: 3px 8px; background: #7928ca; border-radius: 4px; font-size: 12px; margin-bottom: 10px; font-weight: bold; }
        .review-card .stars { color: #ffcc00; margin-bottom: 10px; font-size: 16px; }
        .review-card p { margin: 0; font-size: 14px; line-height: 1.4; color: #ddd; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; overflow-y: auto; }
        .modal-content { background: #151515; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.2); box-sizing: border-box; }
        .input-group { margin: 12px 0; text-align: right; }
        .input-group label { display: block; color: #a1a1a1; font-size: 12px; margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; text-align: right; }
        .input-group input[type="file"] { padding: 5px; text-align: center; cursor: pointer; }
        .action-btn { width: 100%; padding: 10px; background: linear-gradient(90deg, #00ffff, #0080ff); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: black; margin-top: 10px; font-size: 15px; }
        .dropdown { display: none; position: absolute; top: 60px; left: 15px; background: #1f1f1f; border-radius: 10px; border: 1px solid #333; width: 140px; z-index: 100; }
        .dropdown a { display: block; padding: 10px; color: white; text-decoration: none; border-bottom: 1px solid #333; cursor: pointer; font-size: 14px; }
        .dropdown a:last-child { border-bottom: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">ELITEGAMES</div>
    <div class="header-controls">
        <button class="add-btn" id="addAccountBtn" onclick="openAddModal()">+ Add Account</button>
        <div class="menu-btn" onclick="toggleDropdown()">☰</div>
    </div>
    <div class="dropdown" id="navDropdown">
        <a href="#" onclick="toggleDropdown()">Home</a>
        <a href="#" onclick="toggleDropdown()">Platforms</a>
        <a href="#" onclick="toggleDropdown()">About</a>
        <a onclick="openLoginModal()" style="color: #00ffff;" id="loginNavText">Admin Login</a>
    </div>
</header>

<div class="container">
    <input type="text" class="search-bar" id="search" placeholder="Search by game name, platform....">
    <a href="https://tiktok.com/@abdullah.steam" class="vip-btn" target="_blank">👑 VIP</a>
    
    <div class="filters">
        <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="filter-btn" onclick="filterCategory('steam', this)">Steam</button>
        <button class="filter-btn" onclick="filterCategory('epic', this)">Epic Games</button>
        <button class="filter-btn" onclick="filterCategory('capcut', this)">CapCut</button>
    </div>

    <div class="grid" id="game-grid">
        <!-- Dynamic content -->
    </div>

    <!-- Reviews Section - Split Layout -->
    <div class="reviews-section">
        <h2 class="reviews-title">آراء العملاء</h2>
        
        <div class="reviews-content">
            <!-- Left Side: Displayed Reviews -->
            <div class="reviews-display-container" id="reviewsGrid">
                <!-- Dynamic reviews -->
            </div>

            <!-- Right Side: Submission Form -->
            <div class="review-form-container">
                <form class="review-form" id="reviewForm" onsubmit="submitReview(event)">
                    <input type="text" id="reviewerName" placeholder="اسمك" required>
                    <select id="reviewedPlatform" required>
                        <option value="" disabled selected>اختر الحساب الذي اشتريته</option>
                        <option value="Steam">Steam</option>
                        <option value="Epic Games">Epic Games</option>
                        <option value="CapCut">CapCut</option>
                        <option value="Other">أخرى</option>
                    </select>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
                        <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                        <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                        <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                        <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
                    </div>
                    <textarea id="reviewMessage" rows="4" placeholder="رسالتك وتقييمك للموقع..." required></textarea>
                    <button type="submit" class="action-btn" style="background:#00ff80;">إرسال التقييم</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Credentials -->
<div class="modal" id="accountModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="font-size: 18px; margin-bottom: 5px;">Game Title</h2>
        <p id="modalSubtitle" style="color: #888; font-size: 12px; margin-top: 0;">Enter PIN to unlock credentials</p>
        
        <div id="pinSection">
            <div class="input-group">
                <input type="password" id="pinInput" placeholder="Enter 8-digit PIN" maxlength="8" style="text-align: center;">
            </div>
            <button class="action-btn" onclick="verifyPin()">unlock Credentials</button>
        </div>

        <div id="credentialsSection" style="display:none;">
            <div class="input-group">
                <label>USERNAME</label>
                <input type="text" id="modalUser" readonly style="text-align: center;">
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="text" id="modalPass" readonly style="text-align: center;">
            </div>
            <button class="action-btn" style="background:#00ffff;" onclick="copyCredentials()">📋 Copy All Credentials</button>
        </div>

        <button onclick="closeModal('accountModal')" style="background:transparent; border:none; color:#ff5555; margin-top:15px; cursor:pointer; font-size: 14px;">Back</button>
    </div>
</div>

<!-- Modal for Admin Login -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <h2 style="font-size: 18px;">Admin Login</h2>
        <div class="input-group">
            <label>USER / PHONE</label>
            <input type="text" id="loginUser" placeholder="Enter username or phone" style="text-align: center;">
        </div>
        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="loginPass" placeholder="Enter password" style="text-align: center;">
        </div>
        <button class="action-btn" onclick="verifyLogin()">Login</button>
        <button onclick="closeModal('loginModal')" style="background:transparent; border:none; color:#ff5555; margin-top:15px; cursor:pointer; font-size: 14px;">Cancel</button>
    </div>
</div>

<!-- Modal for Adding Account -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <h2 style="font-size: 18px;">Add New Account</h2>
        <div class="input-group">
            <input type="text" id="newTitle" placeholder="Game Title">
        </div>
        <div class="input-group">
            <select id="newCategory">
                <option value="steam">Steam</option>
                <option value="epic">Epic Games</option>
                <option value="capcut">CapCut</option>
            </select>
        </div>
        <div class="input-group">
            <input type="text" id="newUser" placeholder="Username">
        </div>
        <div class="input-group">
            <input type="text" id="newPass" placeholder="Password">
        </div>
        <div class="input-group" style="text-align: center;">
            <label style="color: #fff; margin-bottom: 5px;">Select Game Image</label>
            <input type="file" id="newImgFile" accept="image/*">
        </div>
        <button class="action-btn" style="background:#00ff80;" onclick="saveNewAccount()">Save Account</button>
        <button onclick="closeModal('addModal')" style="background:transparent; border:none; color:#ff5555; margin-top:15px; cursor:pointer; font-size: 14px;">Cancel</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const ADMIN_USER = "+97433293328";
  const ADMIN_PASS = "Aassddffg12345@";
  const CORRECT_PIN = "33293328";
  
  let isLoggedIn = false;
  let currentCredentials = { user: '', pass: '' };
  let accounts = [
      { title: 'The Crew 2', category: 'steam', user: 'hananazzamifdhal', pass: 'Hananazzamifdhal1987hanan', img: 'https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/646980/header.jpg' },
      { title: 'Account CapCut', category: 'capcut', user: 'ricardogomis9@gmail.com', pass: 'Aporlas1000rr!', img: 'https://img.utdstc.com/icon/e10/055/e10055c5866225a6c117d727b1318d18445173f4e177b94bfee01a4e58849b3d:l' }
  ];
  let reviews = [];

  const firebaseConfig = {
      apiKey: "AIzaSyDxe2HvBMaGLrxwcLAZhAMnQs48WsUFEY0",
      authDomain: "steam2-6804d.firebaseapp.com",
      projectId: "steam2-6804d",
      storageBucket: "steam2-6804d.firebasestorage.app",
      messagingSenderId: "293672297879",
      appId: "1:293672297879:web:c8823da857fe2eac3750d2",
      measurementId: "G-BHRHHRGV7K"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.onload = () => {
      loadAccounts();
      loadReviews();
      renderAccounts();
      renderReviews();
  };

  function loadAccounts() {
      const saved = localStorage.getItem('eliteGames_accounts');
      if (saved) { accounts = JSON.parse(saved); }
  }

  function saveAccountsToStorage() {
      localStorage.setItem('eliteGames_accounts', JSON.stringify(accounts));
  }

  function loadReviews() {
      const saved = localStorage.getItem('eliteGames_reviews');
      if (saved) { reviews = JSON.parse(saved); }
  }

  function saveReviewsToStorage() {
      localStorage.setItem('eliteGames_reviews', JSON.stringify(reviews));
  }

  window.toggleDropdown = function() {
      const dropdown = document.getElementById('navDropdown');
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
  }

  const searchInput = document.getElementById('search');
  if (searchInput) {
      searchInput.addEventListener('input', () => {
          const filter = searchInput.value.toLowerCase();
          document.querySelectorAll('.card').forEach(card => {
              const title = card.querySelector('h3').innerText.toLowerCase();
              card.style.display = title.includes(filter) ? '' : 'none';
          });
      });
  }

  window.filterCategory = function(category, element) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      document.querySelectorAll('.card').forEach(card => {
          if (category === 'all' || card.dataset.category === category) {
              card.style.display = '';
          } else {
              card.style.display = 'none';
          }
      });
  }

  function renderAccounts() {
      const grid = document.getElementById('game-grid');
      if (!grid) return;
      grid.innerHTML = '';
      accounts.forEach((acc, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.category = acc.category;
          card.onclick = () => openModal(acc.title, acc.user, acc.pass);
          
          card.innerHTML = `
              <button class="delete-btn" style="display: ${isLoggedIn ? 'flex' : 'none'};" onclick="deleteAccount(event, ${index})">🗑️</button>
              <img src="${acc.img}" alt="${acc.title}" onerror="this.src='https://via.placeholder.com/150'">
              <h3>${acc.title}</h3>
          `;
          grid.appendChild(card);
      });
  }

  window.deleteAccount = function(event, index) {
      event.stopPropagation();
      if (confirm('Are you sure you want to delete this account?')) {
          accounts.splice(index, 1);
          saveAccountsToStorage();
          renderAccounts();
      }
  }

  window.submitReview = async function(event) {
      event.preventDefault();
      const name = document.getElementById('reviewerName').value.trim();
      const platform = document.getElementById('reviewedPlatform').value;
      const ratingElement = document.querySelector('input[name="rating"]:checked');
      
      if (!ratingElement) {
          alert('الرجاء اختيار التقييم بالنجوم');
          return;
      }
      
      const rating = ratingElement.value;
      const message = document.getElementById('reviewMessage').value.trim();

      try {
          await addDoc(collection(db, "reviews"), {
              name, platform, rating, message, date: new Date().toLocaleDateString()
          });
      } catch (e) {
          console.error("Error adding document: ", e);
      }

      const newReview = { name, platform, rating, message, date: new Date().toLocaleDateString() };
      reviews.unshift(newReview);
      saveReviewsToStorage();
      renderReviews();

      document.getElementById('reviewerName').value = '';
      document.getElementById('reviewedPlatform').value = '';
      document.getElementById('reviewMessage').value = '';
      document.querySelectorAll('input[name="rating"]').forEach(el => el.checked = false);
      alert('تم إرسال التقييم وحفظه بنجاح!');
  }

  function renderReviews() {
      const grid = document.getElementById('reviewsGrid');
      if (!grid) return;
      grid.innerHTML = '';
      reviews.forEach(rev => {
          const card = document.createElement('div');
          card.className = 'review-card';
          const stars = '★'.repeat(rev.rating) + '☆'.repeat(5 - rev.rating);
          card.innerHTML = `
              <h4>${rev.name}</h4>
              <div class="platform">${rev.platform}</div>
              <div class="stars">${stars}</div>
              <p>${rev.message}</p>
          `;
          grid.appendChild(card);
      });
      
      onSnapshot(collection(db, "reviews"), (snapshot) => {
          reviews = [];
          snapshot.forEach((doc) => {
              reviews.unshift(doc.data());
          });
          renderReviews();
      });
  }

  window.openModal = function(title, user, pass) {
      document.getElementById('modalTitle').innerText = title;
      currentCredentials.user = user;
      currentCredentials.pass = pass;
      
      document.getElementById('pinInput').value = '';
      document.getElementById('pinSection').style.display = 'block';
      document.getElementById('credentialsSection').style.display = 'none';
      document.getElementById('accountModal').style.display = 'flex';
  }

  window.closeModal = function(modalId) {
      document.getElementById(modalId).style.display = 'none';
  }

  window.verifyPin = function() {
      const enteredPin = document.getElementById('pinInput').value.trim();
      if (enteredPin === CORRECT_PIN) {
          document.getElementById('modalUser').value = currentCredentials.user;
          document.getElementById('modalPass').value = currentCredentials.pass;
          document.getElementById('pinSection').style.display = 'none';
          document.getElementById('credentialsSection').style.display = 'block';
      } else {
          alert('Incorrect PIN!');
      }
  }

  window.copyCredentials = function() {
      const text = `Username: ${currentCredentials.user}\nPassword: ${currentCredentials.pass}`;
      navigator.clipboard.writeText(text).then(() => {
          alert('Credentials copied!');
      });
  }

  window.openLoginModal = function() {
      document.getElementById('loginModal').style.display = 'flex';
      toggleDropdown();
  }

  window.verifyLogin = function() {
      const enteredUser = document.getElementById('loginUser').value.trim();
      const enteredPass = document.getElementById('loginPass').value.trim();

      if (enteredUser === ADMIN_USER && enteredPass === ADMIN_PASS) {
          isLoggedIn = true;
          alert('Logged in as Admin!');
          closeModal('loginModal');
          document.getElementById('loginUser').value = '';
          document.getElementById('loginPass').value = '';
          document.getElementById('addAccountBtn').style.display = 'block';
          document.getElementById('loginNavText').innerText = 'Admin Logged In';
          renderAccounts();
      } else {
          alert('Invalid Admin Credentials!');
      }
  }

  window.openAddModal = function() {
      document.getElementById('addModal').style.display = 'flex';
  }

  window.saveNewAccount = function() {
      const title = document.getElementById('newTitle').value.trim();
      const category = document.getElementById('newCategory').value;
      const user = document.getElementById('newUser').value.trim();
      const pass = document.getElementById('newPass').value.trim();
      const imgFile = document.getElementById('newImgFile').files[0];

      if (!title || !user || !pass || !imgFile) {
          alert('Please fill all fields and select an image!');
          return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
          const imgData = e.target.result;
          accounts.push({ title, category, user, pass, img: imgData });
          saveAccountsToStorage();
          renderAccounts();
          closeModal('addModal');
          
          document.getElementById('newTitle').value = '';
          document.getElementById('newUser').value = '';
          document.getElementById('newPass').value = '';
          document.getElementById('newImgFile').value = '';
      };
      reader.readAsDataURL(imgFile);
  }

  window.onclick = function(event) {
      if (!event.target.matches('.menu-btn') && !event.target.closest('#navDropdown')) {
          const dropdown = document.getElementById('navDropdown');
          if (dropdown && dropdown.style.display === 'block') {
              dropdown.style.display = 'none';
          }
      }
  }
</script>

</body>
</html>
